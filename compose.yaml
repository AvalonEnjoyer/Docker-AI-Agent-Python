services: # docker compose expects
  backend:
    build: 
      context: ./backend
      dockerfile: dev.Dockerfile
    ports: 
      - 8080:8000
    command: uvicorn main:app --host 0.0.0.0 --port 8000 #--reload
    environment:
      - PORT=8000
      - MY_PROJECT=Docker Deployment
    env_file:
      - .env.sample
    # volumes ignore dockerignore commands
    volumes: 
    - ./backend/src:/app
    develop:
      watch:
        - action: rebuild
          path: ./backend/requirements.txt
        - action: rebuild
          path: ./backend/dev.Dockerfile
        # - action: sync
        #   path: ./backend/src
        #   target: /app
        - action: sync+restart
          path: ./backend/src
  static_html: # custom key name
    # image: python:3.14
    build:
      context: ./static_html
      dockerfile: static.Dockerfile
    ports:
    # local machine port: container port
      - 8000:8000
      - 3000:8000
    command: python -m http.server 8000
    volumes:
      - ./static_html/src:/app